name: Supabase keepalive

on:
  schedule:
    # segunda e quinta, 12:00 UTC (maior intervalo entre pings: 4 dias)
    - cron: "0 12 * * 1,4"
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a tabela projects
        run: |
          curl -fsS \
            -H "apikey: ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            "${{ env.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1"
